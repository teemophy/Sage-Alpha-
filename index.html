<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SageAlpha Technologies | Phase 0 Protocol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #fbbf24;
      --emerald: #10b981;
      --navy: #020617;
      --slate: #94a3b8;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--navy);
      color: #f8fafc;
      overflow-x: hidden;
      margin: 0;
    }
    .font-space { font-family: 'Space Grotesk', sans-serif; }
    .font-serif { font-family: 'Playfair Display', serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    
    .bg-grid {
      background-size: 60px 60px;
      background-image: 
        linear-gradient(to right, rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.015) 1px, transparent 1px);
    }
    
    .glass {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .text-gold { color: var(--gold); }
    .text-emerald { color: var(--emerald); }
    .border-gold { border-color: var(--gold); }
    .bg-gold { background-color: var(--gold); }
    
    .glow-gold { box-shadow: 0 0 30px rgba(251, 191, 36, 0.1); }
    .glow-emerald { box-shadow: 0 0 20px rgba(16, 185, 129, 0.2); }

    @keyframes ticker {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .animate-ticker {
      display: inline-block;
      white-space: nowrap;
      animation: ticker 40s linear infinite;
    }

    ::selection { background: var(--gold); color: var(--navy); }
  </style>
<script type="importmap">

  }
}
</script>
</head>

  <div id="root"></div>

</body>
</html>
